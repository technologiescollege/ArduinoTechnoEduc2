name: gitlabsync

# Miroir vers la forge GitLab. Nécessite le secret dépôt GITLAB_TOKEN.
# N'échoue plus silencieusement la CI si le secret est absent.

on:
  push:
    branches:
      - main
  delete:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Git Repo Sync
    # Skip entirely when the GitLab token is not configured.
    if: ${{ secrets.GITLAB_TOKEN != '' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wangchucheng/git-repo-sync@v0.1.0
        with:
          target-url: https://forge.apps.education.fr/canetsebastien/ArduinoTechnoEduc2
          target-username: canetsebastien
          target-token: ${{ secrets.GITLAB_TOKEN }}
