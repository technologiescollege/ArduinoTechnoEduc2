name: Publish Windows release

# Unique workflow de build/publication du fork.
# Produit le ZIP Windows + latest.yml sur la GitHub Release (feed electron-updater).
#
# Déclenchement :
#   - Actions → Publish Windows release → Run workflow
#   - ou : git tag 2.3.12 && git push origin 2.3.12

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier sur GitHub Releases"
        required: true
        default: "always"
        type: choice
        options:
          - always
          - never
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish-win-x64:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.17"
          cache: "yarn"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          # Requis pour @vscode/ripgrep (évite le rate-limit GitHub API)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx node-gyp install
          yarn install --frozen-lockfile

      - name: Build & package Windows x64
        env:
          IS_RELEASE: "true"
          PUBLISH_UPDATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || 'always' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn build:win:x64

      - name: Upload dist backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-dist
          path: |
            electron-app/dist/*.zip
            electron-app/dist/*.yml
            electron-app/dist/*.exe
            electron-app/dist/*.msi
            electron-app/dist/builder-*.yml
          if-no-files-found: warn
